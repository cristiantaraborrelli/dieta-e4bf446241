/* ---------- ATTIVITA' (nome, emoji, MET) ---------- */

/* ---------- ALIMENTI (per 100 g) ---------- */

const FOODS=[

F('pane','Pane','🍞','CAR',270,9,56,0.8,'cps',80,30,200),

F('avena','Fiocchi d\'avena','🥣','CAR',372,13,60,7,'c',50,30,100),

F('fette','Fette biscottate','🍘','CAR',410,11,72,7,'cs',32,16,64,8),

F('banana','Banana','🍌','FRU',89,1.1,23,0.3,'cps',120,120,240,120),
F('mela','Mela','🍎','FRU',52,0.3,14,0.2,'cps',150,150,300,150),
F('pera','Pera','🍐','FRU',57,0.4,15,0.1,'cps',160,160,320,160),
F('arancia','Arancia','🍊','FRU',47,0.9,12,0.1,'cps',180,180,360,180),

F('uva','Uva','🍇','FRU',69,0.7,18,0.2,'cps',120,80,250),
F('fruttasecca','Frutta secca mista','🥜','SEC',654,15,14,65,'cs',25,10,50),
F('mandorle','Mandorle','🌰','SEC',579,21,22,50,'cs',25,10,50),
F('noci','Noci','🌰','SEC',654,15,14,65,'cs',25,10,50),
F('miele','Miele','🍯','DOL',304,0.3,82,0,'cs',15,5,30),
F('marmellata','Marmellata','🍓','DOL',250,0.4,60,0,'cs',25,10,40),
F('arachidi','Burro d\'arachidi','🥜','DOL',588,25,20,50,'cs',20,10,40),
F('fondente','Cioccolato fondente','🍫','DOL',546,5,61,31,'cs',20,10,40),
F('olio','Olio extravergine','🫒','GRA',884,0,0,100,'p',10,5,20),
F('avocado','Avocado','🥑','GRA',160,2,9,15,'cps',70,40,150),
F('parmigiano','Parmigiano','🧀','GRA',392,33,0,28,'p',20,10,40)
];
const BASE_DISPENSA=['olio','pasta','riso','pane','latte','biscotti','parmigiano'];
const byId=id=>FOODS.find(f=>f.id===id);

/* ---------- STATO ---------- */
const DEF={step:0,seed:1,profile:{nome:'Giacomo',sesso:'m',eta:'',peso:'',altezza:'',vita:'leggera',obiettivo:'mantenere'},attivita:{},frigo:{},custom:[],opz:{giorni:1,pasti:5,aggiusta:0},ricerca:'',pesi:[],evento:{nome:'',data:'',min:'',max:''},pasto:{tipo:-1,righe:[]},area:'piano',noSport:false,fatto:false,modifica:false,pianoData:'',pianoSig:'',pianoAgg:false,prezzi:{},budget:'',economico:false,spesaOk:{}};
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{try{const q=indexedDB.open('dietaDB',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}))}
function idbSet(k,v){idb().then(db=>{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}).catch(()=>{})}
function idbGet(k){return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
const NUOVO=()=>JSON.parse(JSON.stringify(DEF));
const KREG='dietaUtenti',KU=id=>'dietaU_'+id;
let state=NUOVO(),reg={lista:[],attivo:null},showUsers=false,confDel=null;
try{const r=JSON.parse(localStorage.getItem(KREG)||'null');if(r&&r.lista)reg=r}catch(e){}
function saveReg(){const j=JSON.stringify(reg);try{localStorage.setItem(KREG,j)}catch(e){}idbSet(KREG,j)}
function clearCustom(){for(let i=FOODS.length-1;i>=0;i--)if(/^c\d{6,}$/.test(FOODS[i].id))FOODS.splice(i,1)}
function caricaUtente(id){
  let st=NUOVO();
  try{const s=JSON.parse(localStorage.getItem(KU(id))||'null');if(s){st=Object.assign(st,s);st.profile=Object.assign({},DEF.profile,s.profile);st.opz=Object.assign({},DEF.opz,s.opz)}}catch(e){}
  st.pasto=Object.assign({tipo:-1,righe:[]},st.pasto);
  if(!AREE.some(a=>a.id===st.area))st.area='piano';
  st.evento=Object.assign({nome:'',data:'',min:'',max:''},st.evento);
  state=st;reg.attivo=id;clearCustom();state.custom.forEach(c=>FOODS.push(c));saveReg();
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{ /* dati salvati prima degli utenti: diventano il primo utente */
  const old=localStorage.getItem('dietaGiacomo');
  if(!reg.lista.length&&old){const o=JSON.parse(old),id='u'+Date.now();localStorage.setItem(KU(id),old);reg.lista.push({id,nome:(o.profile&&o.profile.nome)||'Giacomo'});reg.attivo=id;saveReg()}
}catch(e){}
if(!reg.attivo&&reg.lista.length===1)reg.attivo=reg.lista[0].id;
if(reg.attivo&&reg.lista.some(u=>u.id===reg.attivo))caricaUtente(reg.attivo);else reg.attivo=null;
function save(){if(!reg.attivo)return;const j=JSON.stringify(state);try{localStorage.setItem(KU(reg.attivo),j)}catch(e){}idbSet(KU(reg.attivo),j)}
/* seconda copia automatica (IndexedDB): se la memoria principale risulta vuota, i dati tornano da soli */
if(!reg.lista.length)idbGet(KREG).then(async r=>{
  if(!r)return;const R=JSON.parse(r);if(!R.lista||!R.lista.length)return;
  for(const u of R.lista){const d=await idbGet(KU(u.id));if(d){try{localStorage.setItem(KU(u.id),d)}catch(e){}}}
  reg=R;if(!reg.attivo&&reg.lista.length===1)reg.attivo=reg.lista[0].id;
  if(reg.attivo)caricaUtente(reg.attivo);saveReg();render(false)}).catch(()=>{});
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- CALCOLO FABBISOGNO ---------- */
function profiloOk(){const p=state.profile;return +p.eta>=8&&+p.eta<=90&&+p.peso>=20&&+p.peso<=250&&+p.altezza>=100&&+p.altezza<=230}
function fabb(){
  if(!profiloOk())return null;
  const p=state.profile,w=+p.peso,eta=+p.eta;
  const bmr=10*w+6.25*(+p.altezza)-5*eta+(p.sesso==='m'?5:-161);
  const fatt={sedentaria:1.2,leggera:1.3,attiva:1.4}[p.vita];
  const base=bmr*fatt, vita=base-bmr;
  let sport=0,ore=0;
  for(const [id,,,met] of ACT){const a=state.attivita[id];if(!a)continue;const h=(+a.giorni)*(+a.minuti)/60;ore+=h;sport+=(met-1)*w*h}
  sport/=7;
  const mant=base+sport;
  const adj={mantenere:0,massa:0.1,dimagrire:-0.1}[p.obiettivo];
  const obj=mant*adj;
  const target=Math.round((mant+obj+state.opz.aggiusta)/10)*10;
  const pk=ore>=6?2.0:ore>=3?1.7:1.3;
  const prot=Math.round(w*pk), fat=Math.round(target*0.28/9), carb=Math.round((target-prot*4-fat*9)/4);

/* ---------- PIANIFICATORE ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const COMPS={
 c:[{roles:['LAT'],w:30},{roles:['CAR'],w:38},{roles:['FRU'],w:14,opt:1},{roles:['DOL','SEC','PRO'],w:18,opt:1}],
 s:[{roles:['FRU'],w:40},{roles:['LAT','SEC','CAR'],w:38},{roles:['PRO','DOL'],w:22,opt:1}],
 p:[{roles:['PRO'],w:34},{roles:['CAR'],w:38},{roles:['VER'],w:0,fixed:1},{roles:['GRA'],w:12,opt:1},{roles:['FRU'],w:10,opt:1}]
};
function slots(n){
  const C=(nome,share,tag)=>({nome,share,tag,comps:COMPS[tag]});
  if(n==3)return[C('🌅 Colazione',.25,'c'),C('🍽️ Pranzo',.40,'p'),C('🌙 Cena',.35,'p')];
  if(n==4)return[C('🌅 Colazione',.22,'c'),C('🍽️ Pranzo',.36,'p'),C('🍎 Merenda',.10,'s'),C('🌙 Cena',.32,'p')];
  return[C('🌅 Colazione',.22,'c'),C('🥜 Spuntino',.08,'s'),C('🍽️ Pranzo',.33,'p'),C('🍎 Merenda',.10,'s'),C('🌙 Cena',.27,'p')];
}
const RELAX=['PRO','CAR','LAT','FRU'];
function scale(items,kcal,relax){
  let left=kcal;const adj=[];
  for(const it of items){
    const f=it.food,lim=Math.min(f.max*(relax&&RELAX.includes(f.role)?1.5:1),it.stock);
    it.gmax=lim;
    if(it.fixed){it.g=Math.min(f.def,lim);left-=it.g*f.k/100}else{it.g=0;adj.push(it)}
  }
  let act=adj.slice();
  for(let i=0;i<10&&act.length;i++){
    const sw=act.reduce((a,x)=>a+x.w,0),capped=[];
    for(const it of act){it._g=Math.max(left,0)*(it.w/sw)/(it.food.k/100);if(it._g>=it.gmax)capped.push(it)}
    if(!capped.length){act.forEach(it=>it.g=it._g);break}
    for(const it of capped){it.g=it.gmax;left-=it.g*it.food.k/100}
    act=act.filter(x=>!capped.includes(x));
  }
  const out=[];
  for(const it of items){
    const f=it.food;let g=it.g;
    if(f.pz){const mx=Math.floor(it.gmax/f.pz);if(mx<1)continue;const n=Math.min(mx,Math.max(1,Math.round(g/f.pz)));g=n*f.pz}
    else{const mx=Math.floor(Math.min(it.gmax,9999)/5)*5;g=Math.round(g/5)*5;g=Math.min(Math.max(g,Math.min(f.min,mx)),mx);if(g<5)continue}
    out.push(Object.assign(it,{g,kcal:g*f.k/100,p:g*f.p/100,c:g*f.c/100,f_:g*f.f/100}));
  }
  return out;
}
function composeMeal(slot,kcal,ctx){
  const chosen=[],manca=[];
  for(const comp of slot.comps){
    const all=FOODS.filter(f=>comp.roles.includes(f.role)&&f.tags.includes(slot.tag)&&!chosen.some(c=>c.food===f));
    const key=f=>(ctx.today[f.id]||0)*10+(ctx.usage[f.id]||0)+ctx.rnd()*3+(ctx.eco?prezzoKg(f)/2:0)+(ctx.ideale&&!ctx.usage[f.id]?6:0);
    const fr=all.filter(f=>ctx.ideale?true:(state.frigo[f.id]&&ctx.stock[f.id]>=Math.min(f.min,f.pz||f.min))).sort((a,b)=>key(a)-key(b));
    let food=null,buy=false;
    if(fr.length)food=fr[0];
    if(!food){if(!comp.opt)manca.push(comp.roles[0]);continue}
    chosen.push({food,w:comp.w,fixed:!!comp.fixed,buy,stock:ctx.ideale?Infinity:ctx.stock[food.id]});
  }
  let items=scale(chosen,kcal,false);
  if(kcal-items.reduce((a,x)=>a+x.kcal,0)>kcal*0.08)items=scale(chosen,kcal,true);
  for(const it of items){if(!ctx.ideale)ctx.stock[it.food.id]-=it.g;ctx.today[it.food.id]=(ctx.today[it.food.id]||0)+1;ctx.usage[it.food.id]=(ctx.usage[it.food.id]||0)+1}
  return{nome:slot.nome,tag:slot.tag,target:kcal,items,manca,kcal:items.reduce((a,x)=>a+x.kcal,0)};
}
function buildPlan(r,ideale,nGiorni,eco){
  const rnd=rng(state.seed*7919),stock={},usage={};
  for(const id in state.frigo){const f=byId(id);if(!f)continue;const q=parseFloat(state.frigo[id].q);stock[id]=q>0?q*(f.pz||1):Infinity}
  const days=[];
  for(let d=0;d<(nGiorni||state.opz.giorni);d++){
    const ctx={rnd,stock,usage,today:{},ideale:!!ideale,eco:!!eco};
    const meals=slots(state.opz.pasti).map(s=>composeMeal(s,Math.round(r.target*s.share),ctx));
    const tot={kcal:0,p:0,c:0,f:0};
    meals.forEach(m=>m.items.forEach(i=>{tot.kcal+=i.kcal;tot.p+=i.p;tot.c+=i.c;tot.f+=i.f_}));
    days.push({meals,tot});
  }
  return days;
}
function suggerimenti(days,r){
  const out=[];
  const short=days.reduce((a,d)=>a+Math.max(0,r.target-d.tot.kcal),0)/days.length;
  if(short<r.target*0.05)return{short,out};
  for(const role of ['PRO','CAR','LAT','FRU','VER','GRA']){
    if(Object.keys(state.frigo).some(id=>byId(id)&&byId(id).role===role))continue;
    FOODS.filter(f=>f.role===role&&!state.frigo[f.id]).slice(0,2).forEach(f=>out.push(f));
  }
  return{short,out:out.slice(0,7)};
}

function giorniHtml(days,r,rec){
  const bar=(l,v,t,col)=>`<div class="kv"><span>${l}</span><b>${Math.round(v)} / ${t} g</b></div><div class="bar"><i style="width:${Math.min(100,v/t*100)}%;background:${col}"></i></div>`;

<p class="sub">${Math.round(d.tot.kcal)} kcal su ${r.target}</p>

${d.meals.map((m,mi)=>`<div class="meal"><h4>${m.nome}<span>${Math.round(m.kcal)} kcal</span></h4>
${m.items.map(it=>`<div class="it"><span>${it.food.e} ${esc(it.food.n)}</span><span>${qty(it)} · ${Math.round(it.kcal)} kcal</span></div>`).join('')||'<div class="tag">Niente di adatto nel frigo.</div>'}
${rec?ricettaLink(m,i,mi):''}${m.manca.length?`<div class="tag">Ti manca: ${m.manca.map(x=>ROLES[x].toLowerCase()).join(', ')}</div>`:''}</div>`).join('')}
<div style="margin-top:8px">${bar('Proteine',d.tot.p,r.prot,'#e5533d')}${bar('Carboidrati',d.tot.c,r.carb,'#f59e0b')}${bar('Grassi',d.tot.f,r.fat,'#3b82f6')}</div></div>`).join('')}

<div class="card noprint"><h3>🛒 Lista della spesa</h3><p class="sub">Imposta il tuo budget settimanale: ti preparo la lista con i costi.</p><button class="btn" data-go="8">Apri la lista della spesa</button></div>

<div><label for="og">Quanti giorni</label><select id="og" data-o="giorni">${[1,2,3,5,7].map(x=>`<option ${o.giorni==x?'selected':''}>${x}</option>`).join('')}</select></div>

/* ---------- PESO ---------- */
function oggi(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(s){const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)}
function fk(x){return (Math.round(x*10)/10).toFixed(1).replace('.',',')}
function num(v){return parseFloat(String(v).replace(',','.'))}
function evOk(){const e=state.evento;return !!e.data&&num(e.min)>0&&num(e.max)>=num(e.min)}
function giorniA(data){return Math.round((new Date(data)-new Date(oggi()))/864e5)}
function proiezione(){
  const L=state.pesi.slice(-10);
  if(L.length<2||!evOk())return null;
  const t=x=>new Date(x.d)/864e5,last=L[L.length-1];
  if(t(last)-t(L[0])<2)return null;
  const n=L.length,mx=L.reduce((a,x)=>a+t(x),0)/n,my=L.reduce((a,x)=>a+x.kg,0)/n;
  let sxy=0,sxx=0;L.forEach(x=>{sxy+=(t(x)-mx)*(x.kg-my);sxx+=(t(x)-mx)**2});
  const slope=sxx?sxy/sxx:0;
  const dd=new Date(state.evento.data)/864e5-t(last);
  return{slope,kg:last.kg+slope*dd};
}
function verdetto(){
  if(!evOk()||!state.pesi.length)return null;
  const e=state.evento,mn=num(e.min),mxv=num(e.max),last=state.pesi[state.pesi.length-1].kg,days=giorniA(e.data);
  if(days<0)return{c:'',t:'L\'evento è passato. Aggiorna data e obiettivo per il prossimo.'};
  const pr=proiezione(),sett=Math.max(days,1)/7;
  let t,c='ok';
  if(last>=mn&&last<=mxv&&(!pr||(pr.kg>=mn&&pr.kg<=mxv)))t=`Sei già nel range (${fk(mn)}–${fk(mxv)} kg). Mantieni il peso fino al ${fd(e.data)}.`;
  else if(last>mxv){
    const serve=last-mxv,rit=serve/sett;
    if(rit>1){c='no';t=`Mancano ${fk(serve)} kg in ${days} giorni: sono ${fk(rit)} kg a settimana, troppo veloce. Parlane con l'allenatore o il medico, senza tagli estremi.`}
    else t=`Servono circa ${fk(serve)} kg in ${days} giorni (${fk(rit)} kg a settimana).${pr?` Al ritmo attuale arrivi a circa ${fk(pr.kg)} kg.`:''}`;
    if(pr&&pr.kg>mxv&&rit<=1)c='mid';
  }else if(last<mn){c='mid';t=`Sei sotto il range di ${fk(mn-last)} kg: mangia un po' di più, dai la priorità ai carboidrati.`}
  else if(pr&&pr.kg<mn){c='mid';t=`Al ritmo attuale arrivi a circa ${fk(pr.kg)} kg, sotto il minimo di ${fk(mn)}. Rallenta la discesa.`}
  else{c='mid';t=`Al ritmo attuale arrivi a circa ${fk(pr.kg)} kg, sopra il massimo di ${fk(mxv)}. Serve scendere un po' di più.`}
  return{c,t:t+(+state.profile.eta<18?' Sei ancora in crescita: niente tagli di peso rapidi, segui l\'allenatore e il medico.':'')};
}
function graficoPeso(){
  const L=state.pesi;
  if(!L.length)return '<p class="sub">Registra il primo peso per vedere il grafico.</p>';
  const W=600,H=260,m={l:46,r:16,t:22,b:32},ev=evOk()?state.evento:null,pr=proiezione();
  const ts=L.map(x=>new Date(x.d).getTime()),te=ev?new Date(ev.data).getTime():0;
  const t0=Math.min(...ts),t1=Math.max(...ts,te||0);
  const ks=L.map(x=>x.kg);if(ev){ks.push(num(ev.min),num(ev.max));if(pr)ks.push(pr.kg)}
  const lo=Math.floor(Math.min(...ks)-1),hi=Math.ceil(Math.max(...ks)+1);
  const X=t=>m.l+(t1===t0?(W-m.l-m.r)/2:(t-t0)/(t1-t0)*(W-m.l-m.r));
  const Y=k=>m.t+(hi-k)/(hi-lo)*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Andamento del peso">`;
  if(ev)s+=`<rect x="${m.l}" y="${Y(num(ev.max))}" width="${W-m.l-m.r}" height="${Math.max(2,Y(num(ev.min))-Y(num(ev.max)))}" style="fill:var(--acc2)"/><text x="${m.l+6}" y="${Y(num(ev.max))+14}" font-size="12" style="fill:var(--acc)">range ${fk(num(ev.min))}–${fk(num(ev.max))} kg</text>`;
  for(let i=0;i<=4;i++){const k=lo+(hi-lo)*i/4,y=Y(k);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="12" style="fill:var(--mut)">${Math.round(k*10)/10}</text>`}
  if(ev){const xe=X(te);s+=`<line x1="${xe}" x2="${xe}" y1="${m.t}" y2="${H-m.b}" style="stroke:var(--warm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${xe-6}" y="${m.t-6}" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--warnt)">${esc(ev.nome||'Evento')} ${fd(ev.data)}</text>`}
  const pts=L.map(x=>`${X(new Date(x.d).getTime())},${Y(x.kg)}`);
  if(L.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lp=pts[L.length-1].split(',');
  if(ev&&pr&&te>ts[ts.length-1])s+=`<line x1="${lp[0]}" y1="${lp[1]}" x2="${X(te)}" y2="${Y(pr.kg)}" style="stroke:var(--mut)" stroke-width="2" stroke-dasharray="3 5"/><circle cx="${X(te)}" cy="${Y(pr.kg)}" r="4" style="fill:var(--card);stroke:var(--mut)" stroke-width="2"/>`;
  L.forEach((x,i)=>{const [px,py]=pts[i].split(',');const last=i===L.length-1;s+=`<circle cx="${px}" cy="${py}" r="${last?6:3.5}" style="fill:${last?'var(--acc)':'var(--card)'};stroke:var(--acc)" stroke-width="2"/>`});
  const a=L[0];
  s+=`<text x="${t1>t0?m.l:W/2}" y="${H-8}" text-anchor="${t1>t0?'start':'middle'}" font-size="12" style="fill:var(--mut)">${fd(a.d)}</text>`;
  if(t1>t0)s+=`<text x="${W-m.r}" y="${H-8}" text-anchor="end" font-size="12" style="fill:var(--mut)">${fd(new Date(t1).toISOString().slice(0,10))}</text>`;
  s+=`<text x="${Math.min(+lp[0],W-m.r-24)}" y="${+lp[1]-12}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ink)">${fk(L[L.length-1].kg)}</text>`;
  return s+'</svg>';
}

function vObiettivo(){
  const L=state.pesi,b=L[L.length-1],e=state.evento,ok=evOk(),vd=verdetto();
  const sg=v=>(v>0?'+':v<0?'−':'')+fk(Math.abs(v))+' kg';

  let ob='—';
  if(b&&ok){const mn=num(e.min),mxv=num(e.max);ob=b.kg>mxv?sg(mxv-b.kg):b.kg<mn?sg(mn-b.kg):'✅ nel range'}

  return `<div class="card"><h2>Il tuo obiettivo 🎯</h2><p class="sub">Per esempio un incontro di pugilato: devi arrivare tra 60 e 65 kg. Scrivi la data e la fascia di peso: sul grafico vedi se sei in linea.</p>

<div class="card"><div class="row" style="margin-bottom:12px">${stat('Peso attuale',b?fk(b.kg)+' kg':'—')}${stat(ok&&gg>=0?'Giorni mancanti':'Giorni',ok?gg:'—')}${stat('Al range',ob)}</div>
${graficoPeso()}
${vd?`<div class="${vd.c==='ok'||!vd.c?'':'warn'}" style="margin:12px 0 0;${vd.c==='ok'?'background:var(--acc2);border-radius:12px;padding:12px;font-size:14px':''}">${vd.c==='no'?'⚠️':vd.c==='ok'?'✅':'🎯'} ${esc(vd.t)}</div>`:''}
${!L.length?'<p class="sub">Segna il tuo peso nell\'area Peso per vedere l\'andamento.</p>':''}
<div class="btns"><span></span><button class="btn sec" data-go="5">⚖️ Segna il peso</button></div></div>`}

function prezzoKg(f){const v=state.prezzi[f.id];if(v!==undefined&&v!==''){const n=parseFloat(String(v).replace(',','.'));if(n>=0)return n}return PREZZI[f.id]||0}
const eur=x=>x.toFixed(2).replace('.',',')+' €';
function spesaCalc(eco){
  const r=fabb();if(!r)return null;
  const days=buildPlan(r,true,7,eco);
  const need={};days.forEach(d=>d.meals.forEach(m=>m.items.forEach(i=>{need[i.food.id]=(need[i.food.id]||0)+i.g})));
  const rows=[];let tot=0;
  for(const id in need){
    const f=byId(id);if(!f)continue;
    let g=need[id],gia=0,nota='';
    const fr=state.frigo[id];
    if(fr){const q=parseFloat(fr.q);if(q>0)gia=Math.min(g,q*(f.pz||1));else{gia=g;nota='già in frigo'}}
    const da=g-gia;
    if(da<=0.5){rows.push({f,da:0,costo:0,nota:nota||'già in frigo'});continue}
    const arr=f.pz?Math.ceil(da/f.pz-0.001)*f.pz:Math.ceil(da/50)*50;
    const costo=arr/1000*prezzoKg(f);
    tot+=costo;rows.push({f,da:arr,costo,nota:gia>0?`ne hai già ${Math.round(gia)} g`:''});
  }
  const ordine=Object.keys(ROLES);
  rows.sort((a,b)=>ordine.indexOf(a.f.role)-ordine.indexOf(b.f.role)||a.f.n.localeCompare(b.f.n));
  return{rows,tot}
}

  if(A.id==='pasto')body=(showUsers?vUtenti():'')+vPasto();
  else if(!reg.attivo)body=vUtenti();
  else body=(showUsers?vUtenti():'')+(showHome?homeHtml():'')+(A.id==='piano'&&state.fatto&&state.modifica?`<div class="warn">✏️ Stai modificando i dati. Quando hai finito tocca <b>Salva modifiche</b>: il piano si aggiorna con i dati nuovi.</div>`:'')+(!state.fatto&&A.id!=='piano'?`<div class="warn">👉 Prima crea il tuo piano: dati completati <b>${completezza().pct}/100</b>. <button class="chip" data-area="piano">Crea il mio piano</button></div>`:'')+(A.id==='piano'&&!state.fatto?`<div class="subnav"><button class="${state.step===0?'on':''}" data-go="0">1 · Dati</button><button class="${state.step===1?'on':''}" data-go="1">2 · Attività</button><button data-concludi>3 · Crea il piano</button></div>`:A.steps.length>1?`<div class="subnav">${A.steps.map(i=>`<button class="${i===state.step?'on':''}" data-go="${i}">${STEPS[i]}</button>`).join('')}</div>`:'')+(A.id==='piano'&&inModifica()?`<div id="compl">${completezzaHtml()}</div>`:'')+VIEWS[state.step]();
  $('#main').innerHTML=body;
  if(keepScroll)scrollTo(0,y);else scrollTo(0,0);
  save();
}
function setPath(path,v){const [a,b]=path.split('.');state[a][b]=v}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-seg],[data-act],[data-food],[data-dispensa],[data-addcustom],[data-save],[data-cp],[data-ptset],[data-concludi],[data-modifica],[data-eco],[data-nosport],[data-vai],[data-area],[data-pick],[data-addpasto],[data-delpasto],[data-clearpasto],[data-users],[data-backup],[data-restore],[data-switch],[data-deluser],[data-newuser],[data-home],[data-install],[data-regen],[data-addpeso],[data-clearev],[data-delpeso],[data-print],[data-addfood]');
  if(!t)return;
  if(e.target.closest('.cfg')&&t.dataset.act)return;
  const d=t.dataset;
  if('go' in d){state.step=+d.go;state.area=areaOf(+d.go);showUsers=false;render()}
  else if('seg' in d){setPath(d.seg,d.v);render(true)}
  else if('act' in d){const id=d.act;if(state.attivita[id])delete state.attivita[id];else{state.attivita[id]={giorni:2,minuti:60};state.noSport=false}render(true)}
  else if('food' in d){if(state.frigo[d.food])delete state.frigo[d.food];else state.frigo[d.food]={q:''};$('#grid').innerHTML=gridHtml();$('#stock').innerHTML=stockList();updVerd();save()}
  else if('dispensa' in d){BASE_DISPENSA.forEach(id=>{if(!state.frigo[id])state.frigo[id]={q:''}});render(true)}
  else if('addcustom' in d){
    const n=$('#cn').value.trim(),k=+$('#ck').value;if(!n||!(k>0)){alert('Inserisci almeno nome e kcal per 100 g.');return}
    const f=F('c'+Date.now(),n,'🍽️',$('#cr').value,k,+$('#cp').value||0,+$('#cc').value||0,+$('#cf').value||0,'cps',100,20,300);
    FOODS.push(f);state.custom.push(f);state.frigo[f.id]={q:''};render(true)}
  else if('backup' in d){
    save();const dati={};reg.lista.forEach(u=>{try{dati[u.id]=JSON.parse(localStorage.getItem(KU(u.id))||'null')}catch(e){}});
    const txt='DIETA1:'+JSON.stringify({reg:{lista:reg.lista,attivo:reg.attivo},dati});
    reg.copia=oggi();saveReg();const bk=$('#bk');bk.value=txt;bk.select();
    const mm=t=>{const e=$('#bmsg');if(e)e.textContent=t},ok=()=>mm('Copia pronta e copiata. Incollala in un posto sicuro.'),no=()=>mm('Copia pronta nel riquadro: selezionala e copiala a mano.');
    try{navigator.clipboard.writeText(txt).then(ok,no)}catch(e){no()}}
  else if('restore' in d){
    try{
      const raw=$('#bk').value.trim();if(!raw.startsWith('DIETA1:'))throw 0;
      const o=JSON.parse(raw.slice(7));if(!o.reg||!Array.isArray(o.reg.lista)||!o.dati)throw 0;
      o.reg.lista.forEach(u=>{if(!o.dati[u.id])return;localStorage.setItem(KU(u.id),JSON.stringify(o.dati[u.id]));if(!reg.lista.some(x=>x.id===u.id))reg.lista.push({id:u.id,nome:u.nome})});
      const id=o.reg.attivo&&reg.lista.some(u=>u.id===o.reg.attivo)?o.reg.attivo:reg.lista[0].id;
      caricaUtente(id);showUsers=false;render(false)
    }catch(e){$('#bmsg').textContent='Copia non valida: incolla il testo completo che inizia con DIETA1:';$('#bmsg').style.color='var(--red)'}}
  else if('save' in d){
    save();let ok=false;
    try{ok=!!reg.attivo&&localStorage.getItem(KU(reg.attivo))===JSON.stringify(state)}catch(e){}
    const tt=$('#toast');tt.textContent=ok?'✅ Dati salvati su questo telefono.':'⚠️ Il browser non permette di salvare qui: usa «Copia i miei dati» in 👤 Utenti.';tt.hidden=false;
    clearTimeout(window._tt);window._tt=setTimeout(()=>{tt.hidden=true},2600)}
  else if('cp' in d){const [di,mi]=d.cp.split('-'),m=lastPlan[+di].meals[+mi];state.pasto.tipo=+mi;state.pasto.righe=m.items.map(i=>({id:i.food.id,g:i.g}));state.area='pasto';render()}
  else if('ptset' in d){state.pasto.tipo=state.pasto.tipo===+d.ptset?-1:+d.ptset;render(true)}
  else if('concludi' in d){const c=completezza();if(c.pct<100){$('#cmsg2').textContent='Mancano ancora: '+c.mancano.map(x=>x.k.toLowerCase()).join(', ')+'.';return}const eraFatto=state.fatto;state.fatto=true;state.modifica=false;state.pianoData=oggi();state.pianoAgg=eraFatto;state.pianoSig=sigDati();if(eraFatto)state.seed++;state.step=4;state.area='piano';render()}
  else if('modifica' in d){state.modifica=true;state.step=0;state.area='piano';showUsers=false;showHome=false;render(false)}
  else if('eco' in d){state.economico=!state.economico;state.pianoData=state.pianoData;render(true)}
  else if('nosport' in d){state.noSport=!state.noSport;if(state.noSport)state.attivita={};render(true)}
  else if('vai' in d){const v=$('#verdetto');if(v)v.scrollIntoView({behavior:'smooth',block:'start'})}
  else if('area' in d){state.area=d.area;showUsers=false;showHome=false;render(false)}
  else if('pick' in d){pSel=d.pick;const f=byId(pSel);$('#pfq').value=f.n;$('#pu').innerHTML=unitHtml(f);aggiornaSug();$('#pq').focus()}
  else if('addpasto' in d){
    const q=$('#pfq').value.trim(),qt=num($('#pq').value),u=$('#pu').value,msg=$('#pmsg2');
    let f=pSel?byId(pSel):null;
    if(!f&&q){const m=cerca(q);const ex=m.find(x=>norm(x.n)===norm(q));if(ex)f=ex;else if(m.length===1)f=m[0];else if(m.length>1){msg.textContent="Tocca l'alimento giusto nella lista qui sopra.";return}}
    if(!f&&q){const kc=num($('#pkc').value);if(kc>0){f=F('c'+Date.now(),q.charAt(0).toUpperCase()+q.slice(1),'🍽️','ALT',kc,num($('#pkp').value)||0,num($('#pkch').value)||0,num($('#pkf').value)||0,'cps',100,5,2000);FOODS.push(f);state.custom.push(f)}else{msg.textContent='Non lo trovo: scrivi le kcal per 100 g qui sopra.';return}}
    if(!f||!(qt>0)){msg.textContent='Scrivi cosa hai mangiato e la quantità.';return}
    pSel=null;state.pasto.righe.push({id:f.id,g:Math.round(convG(f,qt,u)*10)/10});render(true)}
  else if('delpasto' in d){state.pasto.righe.splice(+d.delpasto,1);render(true)}
  else if('clearpasto' in d){state.pasto.righe=[];render(true)}
  else if('users' in d){showUsers=!showUsers;confDel=null;render(false)}
  else if('switch' in d){caricaUtente(d.switch);showUsers=false;showHome=false;render(false)}
  else if('deluser' in d){
    if(confDel===d.deluser){try{localStorage.removeItem(KU(d.deluser))}catch(e){}reg.lista=reg.lista.filter(u=>u.id!==d.deluser);if(reg.attivo===d.deluser){reg.attivo=null;state=NUOVO();clearCustom()}saveReg();confDel=null}else confDel=d.deluser;
    render(true)}
  else if('newuser' in d){
    const n=$('#nu').value.trim();if(!n){$('#umsg').textContent='Scrivi il nome.';return}
    const id='u'+Date.now();reg.lista.push({id,nome:n});state=NUOVO();state.profile.nome=n;reg.attivo=id;clearCustom();saveReg();save();showUsers=false;render(false)}
  else if('home' in d){showHome=!showHome;render(false)}
  else if('install' in d){if(dp){dp.prompt();dp=null}render(true)}
  else if('regen' in d){state.seed++;render(true)}
  else if('print' in d){window.print()}
  else if('addpeso' in d){
    const dd=$('#pd').value,kg=parseFloat(String($('#pk').value).replace(',','.'));
    if(!dd||!(kg>=20&&kg<=250)){$('#pmsg').textContent='Inserisci una data e un peso valido (tra 20 e 250 kg).';return}
    state.pesi=state.pesi.filter(x=>x.d!==dd);state.pesi.push({d:dd,kg:Math.round(kg*10)/10});state.pesi.sort((a,b)=>a.d<b.d?-1:1);
    if(state.pesi[state.pesi.length-1].d===dd)state.profile.peso=String(Math.round(kg*10)/10);
    render(true)}
  else if('clearev' in d){state.evento={nome:'',data:'',min:'',max:''};render(true)}
  else if('delpeso' in d){state.pesi.splice(+d.delpeso,1);render(true)}
  else if('addfood' in d){state.frigo[d.addfood]={q:''};render(true)}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.p!==undefined){state.profile[d.p]=t.value;save();updCompl();if(d.p==='nome'){const u=reg.lista.find(x=>x.id===reg.attivo);if(u){u.nome=t.value.trim()||u.nome;saveReg();const ub=$('#utbtn');if(ub)ub.textContent='👤 '+u.nome}}}
  else if(d.af){const [id,k]=d.af.split(':');if(state.attivita[id]){state.attivita[id][k]=t.value;save()}}
  else if(d.q){state.frigo[d.q].q=t.value;save();updVerd()}
  else if(d.search!==undefined){state.ricerca=t.value;$('#grid').innerHTML=gridHtml()}
  else if(d.aggiusta!==undefined){state.opz.aggiusta=+t.value;save()}
  else if(d.ev){state.evento[d.ev]=t.value;save()}
  else if(d.budget!==undefined){state.budget=t.value;save();updSpesa()}
  else if(d.prezzo!==undefined){state.prezzi[d.prezzo]=t.value;save();updSpesa()}
  else if(d.pq!==undefined){pSel=null;aggiornaSug();const m=cerca(t.value);$('#pu').innerHTML=unitHtml(m.length===1?m[0]:null)}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.sp!==undefined){state.spesaOk[d.sp]=t.checked;save();render(true)}
  else if(d.o){state.opz[d.o]=+t.value;render(true)}
  else if(d.aggiusta!==undefined){state.apriCalc=true;render(true)}
  else if(d.ev){render(true)}
  else if(d.ptipo!==undefined){state.pasto.tipo=+t.value;render(true)}
  else if(d.pf!==undefined){$('#pu').innerHTML=unitHtml(byId(t.value))}
});
render();
</script>
